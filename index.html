<!DOCTYPE html>  
<html lang="zh-CN">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
    <title>塔罗·时光 | Tarot Time</title>  
    <!-- Tailwind CSS -->  
    <script src="https://cdn.tailwindcss.com"></script>  
    <!-- Telegram WebApp SDK -->  
    <script src="https://telegram.org/js/telegram-web-app.js"></script>  
    <!-- Google Fonts -->  
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">  
    <style>  
        :root {  
            --tg-theme-bg-color: #050505;  
            --tg-theme-text-color: #e0e0e0;  
            --champagne-gold: #D4AF37;  
        }  
        body {  
            background-color: var(--tg-theme-bg-color);  
            color: var(--tg-theme-text-color);  
            font-family: 'Noto Serif SC', serif;  
            overflow: hidden; /* 防止原生滚动，保持沉浸感 */  
            touch-action: none;  
        }  
        /* Canvas 星尘背景 */  
        #particle-canvas {  
            position: fixed;  
            top: 0;  
            left: 0;  
            width: 100vw;  
            height: 100vh;  
            z-index: -1;  
            pointer-events: none;  
        }  
        /* 3D 卡牌翻转容器 */  
        .card-container {  
            perspective: 1000px;  
            width: 80px;  
            height: 140px;  
            margin: 0 auto;  
        }  
        .card-inner {  
            width: 100%;  
            height: 100%;  
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);  
            transform-style: preserve-3d;  
            cursor: pointer;  
        }  
        .card-inner.is-flipped {  
            transform: rotateY(180deg);  
        }  
        .card-front, .card-back {  
            position: absolute;  
            width: 100%;  
            height: 100%;  
            backface-visibility: hidden;  
            border-radius: 6px;  
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);  
            border: 1px solid rgba(255,255,255,0.1);  
        }  
        /* 牌背：极简暗黑+微光 */  
        .card-back {  
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);  
            display: flex;  
            align-items: center;  
            justify-content: center;  
        }  
        .card-back::after {  
            content: '✧';  
            color: rgba(255,255,255,0.2);  
            font-size: 24px;  
        }  
        /* 牌面：这里预留给你自己的素材 */  
        .card-front {  
            background-color: #fff; /* 默认底色 */  
            background-size: cover;  
            background-position: center;  
            transform: rotateY(180deg);  
        }  
        /* 天命虚位：香槟金呼吸光晕 */  
        .slot-empty {  
            border: 1px dashed rgba(212, 175, 55, 0.3);  
            border-radius: 6px;  
            animation: breathe 3s infinite ease-in-out;  
        }  
        @keyframes breathe {  
            0%, 100% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.1); }  
            50% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); border-color: rgba(212, 175, 55, 0.6); }  
        }  
        /* 动态缩放算法的容器 */  
        #spread-area {  
            position: relative;  
            height: 40vh;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            gap: 15px;  
        }  
        /* 隐藏原生滚动条 */  
        ::-webkit-scrollbar { display: none; }  
    </style>  
</head>  
<body class="flex flex-col h-screen">  
  
    <!-- Canvas 粒子背景 -->  
    <canvas id="particle-canvas"></canvas>  
  
    <!-- 顶部状态栏 -->  
    <header class="w-full p-6 flex justify-between items-center z-10">  
        <h1 class="text-xl tracking-widest text-white/80 font-bold">TAROT·TIME</h1>  
        <div id="user-badge" class="text-xs px-3 py-1 border border-white/20 rounded-full text-white/50 backdrop-blur-sm">  
            连接中...  
        </div>  
    </header>  
  
    <!-- 核心牌阵交互区 -->  
    <main class="flex-1 flex flex-col items-center justify-center w-full z-10 px-4">  
        <!-- 动态生成的牌位区域 -->  
        <div id="spread-area" class="w-full max-w-md">  
            <!-- 初始示例：每日指引（单张） -->  
            <div class="card-container" id="slot-0">  
                <div class="card-inner" onclick="flipCard(this)">  
                    <div class="card-back"></div>  
                    <!-- 记得替换为你自己的图片路径 -->  
                    <div class="card-front" style="background-image: url('./assets/cards/m00.jpg');"></div>  
                </div>  
            </div>  
        </div>  
  
        <p id="system-hint" class="mt-8 text-sm text-white/40 tracking-wider transition-opacity duration-500">  
            轻触牌背，揭示命运  
        </p>  
    </main>  
  
    <!-- 底部操作与神谕追问区 -->  
    <footer class="w-full p-6 z-10 flex flex-col gap-4 backdrop-blur-md bg-black/40 border-t border-white/10 rounded-t-3xl">  
        <div class="flex items-center gap-2">  
            <input type="text" id="question-input" placeholder="向牌灵追问具体细节..."   
                   class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-white/30 focus:outline-none focus:border-[#D4AF37] transition-colors">  
            <button onclick="askOracle()"   
                    class="bg-[#D4AF37]/20 text-[#D4AF37] border border-[#D4AF37]/50 rounded-xl px-5 py-3 text-sm font-bold tracking-widest active:scale-95 transition-transform">  
                共鸣  
            </button>  
        </div>  
        <div id="ai-response" class="hidden text-sm text-white/80 leading-relaxed max-h-32 overflow-y-auto p-2">  
            <!-- AI 回复将在这里打字机输出 -->  
        </div>  
    </footer>  
  
    <script>  
        // ==========================================  
        // 1. Telegram Mini App 初始化逻辑  
        // ==========================================  
        const tg = window.Telegram.WebApp;  
        let currentUser = { id: null, name: "Seeker" };  
  
        function initTelegram() {  
            tg.ready();  
            tg.expand(); // 全屏沉浸  
            tg.setHeaderColor('#050505');  
            tg.setBackgroundColor('#050505');  
  
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {  
                currentUser.id = tg.initDataUnsafe.user.id;  
                currentUser.name = tg.initDataUnsafe.user.first_name;  
                document.getElementById('user-badge').innerText = `灵境映射: ${currentUser.name}`;  
            } else {  
                // H5 本地环境的 Fallback（利用 localStorage）  
                let localUid = localStorage.getItem('tarot_time_uid');  
                if (!localUid) {  
                    localUid = 'usr_' + Math.random().toString(36).substr(2, 9);  
                    localStorage.setItem('tarot_time_uid', localUid);  
                }  
                currentUser.id = localUid;  
                document.getElementById('user-badge').innerText = `本地感应`;  
            }  
        }  
  
        // ==========================================  
        // 2. 核心交互逻辑：翻牌与震动反馈  
        // ==========================================  
        let isFlipped = false;  
          
        function flipCard(element) {  
            if (element.classList.contains('is-flipped')) return;  
              
            // 触发 TG 物理震动反馈  
            if (tg.HapticFeedback) {  
                tg.HapticFeedback.impactOccurred('medium');  
            }  
  
            element.classList.add('is-flipped');  
            isFlipped = true;  
              
            // 文字消散机制  
            const hint = document.getElementById('system-hint');  
            hint.style.opacity = '0';  
            setTimeout(() => {  
                hint.innerText = "愚者 (The Fool) - 正位"; // 这里接你的牌库数据  
                hint.style.opacity = '1';  
            }, 500);  
        }  
  
        // ==========================================  
        // 3. Vercel Serverless API 连结逻辑  
        // ==========================================  
        async function askOracle() {  
            const input = document.getElementById('question-input');  
            const responseArea = document.getElementById('ai-response');  
            const question = input.value.trim();  
  
            if (!question) {  
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');  
                return;  
            }  
  
            if (!isFlipped) {  
                alert("请先翻开牌阵，再与牌灵共鸣。");  
                return;  
            }  
  
            // UI 状态更新  
            input.disabled = true;  
            responseArea.classList.remove('hidden');  
            responseArea.innerHTML = '<span class="animate-pulse text-[#D4AF37]">牌灵正在凝视你的命运线...</span>';  
  
            try {  
                // 调用部署在 Vercel 上的 Laf 迁移接口  
                const res = await fetch('/api/tarrt', {  
                    method: 'POST',  
                    headers: { 'Content-Type': 'application/json' },  
                    body: JSON.stringify({   
                        prompt: `用户问题：${question}。当前牌面：愚者（正位）。请以塔罗牌灵的第一人称回答。`,  
                        uid: currentUser.id // 传给后端用于记忆匹配  
                    })  
                });  
  
                const data = await res.json();  
                  
                if (data.choices && data.choices[0]) {  
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');  
                    typeWriterEffect(responseArea, data.choices[0].message.content);  
                } else {  
                    throw new Error("星象连接异常");  
                }  
            } catch (error) {  
                responseArea.innerHTML = `<span class="text-red-400">灵境感应中断: ${error.message}</span>`;  
            } finally {  
                input.disabled = false;  
                input.value = '';  
            }  
        }  
  
        // 简易打字机效果  
        function typeWriterEffect(element, text) {  
            element.innerHTML = '';  
            let i = 0;  
            const timer = setInterval(() => {  
                if (i < text.length) {  
                    element.innerHTML += text.charAt(i);  
                    i++;  
                } else {  
                    clearInterval(timer);  
                }  
            }, 30); // 打字速度  
        }  
  
        // ==========================================  
        // 4. Canvas 星尘粒子系统 (氛围烘托)  
        // ==========================================  
        const canvas = document.getElementById('particle-canvas');  
        const ctx = canvas.getContext('2d');  
        let particles = [];  
  
        function resize() {  
            canvas.width = window.innerWidth;  
            canvas.height = window.innerHeight;  
        }  
        window.addEventListener('resize', resize);  
        resize();  
  
        class Particle {  
            constructor() {  
                this.x = Math.random() * canvas.width;  
                this.y = Math.random() * canvas.height;  
                this.size = Math.random() * 1.5;  
                this.speedY = Math.random() * 0.5 + 0.1;  
                this.opacity = Math.random() * 0.5 + 0.1;  
            }  
            update() {  
                this.y -= this.speedY;  
                if (this.y < 0) {  
                    this.y = canvas.height;  
                    this.x = Math.random() * canvas.width;  
                }  
            }  
            draw() {  
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;  
                ctx.beginPath();  
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);  
                ctx.fill();  
            }  
        }  
  
        function initParticles() {  
            for (let i = 0; i < 50; i++) particles.push(new Particle());  
        }  
  
        function animate() {  
            ctx.clearRect(0, 0, canvas.width, canvas.height);  
            particles.forEach(p => { p.update(); p.draw(); });  
            requestAnimationFrame(animate);  
        }  
  
        // 启动应用  
        initTelegram();  
        initParticles();  
        animate();  
    </script>  
</body>  
</html>
