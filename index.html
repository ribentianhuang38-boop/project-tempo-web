    <style>  
        /* 核心调色板与全局变量 */  
        :root {   
            --font-occult: 'Didot', 'Bodoni MT', 'Noto Serif SC', 'Songti SC', serif;  
            --font-sans: system-ui, -apple-system, sans-serif;  
        }  
          
        /* 🔥 高级黑模式：带有景深和呼吸感的工业黑 */  
        .dark {   
            --gold: #d4af37; /* 亮金色 */  
            --bg-center: #1a1a20; /* 聚光灯中心的微暖深灰 */  
            --bg-edge: #050507;   /* 边缘的极暗色 */  
            --text: #e8e8e8;  
            --card-bg: #141417;   
            --particle-base: #ffffff;   
            --glass-bg: linear-gradient(135deg, rgba(26, 26, 30, 0.6) 0%, rgba(10, 10, 12, 0.8) 100%);  
            --glass-border: rgba(212, 175, 55, 0.15);  
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);  
            --overlay: rgba(5, 5, 7, 0.85); /* 聊天背景罩层 */  
            --input-bg: rgba(0, 0, 0, 0.4);  
            --btn-oracle-bg: linear-gradient(to bottom, #1a1a1c, #000000);  
            --btn-oracle-border: rgba(212, 175, 55, 0.6);  
            --btn-oracle-text: var(--gold);  
            --bubble-ai-bg: rgba(255, 255, 255, 0.05);  
            --bubble-ai-border: rgba(255, 255, 255, 0.1);  
            --bubble-user-bg: rgba(212, 175, 55, 0.15);  
        }  
          
        /* ☀️ 白昼模式：柔和高对比，修复金字发白不可读的问题 */  
        .light {   
            --gold: #b89324; /* 调低亮度的复古金，保证白色背景下的可读性 */  
            --bg-center: #ffffff;   
            --bg-edge: #e8e8ed;  
            --text: #2c2c2c;   
            --card-bg: #ffffff;   
            --particle-base: #6b6b6b;   
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(240, 240, 245, 0.8) 100%);  
            --glass-border: rgba(212, 175, 55, 0.35);  
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);  
            --overlay: rgba(255, 255, 255, 0.85);  
            --input-bg: rgba(255, 255, 255, 0.6);  
            --btn-oracle-bg: linear-gradient(to bottom, #ffffff, #f0f0f5);  
            --btn-oracle-border: rgba(184, 147, 36, 0.5);  
            --btn-oracle-text: var(--gold);  
            --bubble-ai-bg: rgba(0, 0, 0, 0.03);  
            --bubble-ai-border: rgba(0, 0, 0, 0.08);  
            --bubble-user-bg: rgba(212, 175, 55, 0.15);  
        }  
  
        body {  
            background: radial-gradient(circle at 50% 40%, var(--bg-center) 0%, var(--bg-edge) 100%);  
            background-color: var(--bg-edge); /* 兜底 */  
            color: var(--text);  
            font-family: var(--font-sans);  
            transition: background 0.5s ease, background-color 0.5s ease, color 0.5s ease;  
            user-select: none; -webkit-tap-highlight-color: transparent;  
            overflow: hidden; touch-action: none;   
        }  
          
        h1, h2, h3, .font-occult, #chat-container {  
            font-family: var(--font-occult) !important;  
            font-weight: 300;  
        }  
  
        /* 升级后的动态毛玻璃 */  
        .frosted {  
            background: var(--glass-bg);  
            border: 1px solid var(--glass-border);  
            box-shadow: var(--glass-shadow);  
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);  
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;  
        }  
          
        canvas { position: absolute; top: 0; left: 0; z-index: 5; width: 100vw; height: 100vh; pointer-events: auto; }  
        .layer-10 { z-index: 10; } .layer-20 { z-index: 20; } .layer-40 { z-index: 40; }  
          
        /* 彻底移除滑条 */  
        .no-scrollbar::-webkit-scrollbar { display: none; }  
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }  
          
        .btn-hidden { transform: translate(-50%, 20px) scale(0.9); opacity: 0; pointer-events: none; }  
        .btn-reveal {  
            transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto;  
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease-out;  
        }  
          
        /* 自适应主题的神谕按钮 */  
        .btn-oracle {  
            background: var(--btn-oracle-bg);  
            border: 1px solid var(--btn-oracle-border);  
            color: var(--btn-oracle-text);  
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, transform 0.1s;  
        }  
          
        .mist-reveal {  
            opacity: 0;  
            animation: mistFade 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;  
            will-change: filter, opacity, transform;  
        }  
        @keyframes mistFade {  
            0% { filter: blur(10px); opacity: 0; transform: translateY(8px); }  
            100% { filter: none; opacity: 1; transform: translateY(0); }  
        }  
  
        .safe-top-nav {  
            top: max(2rem, env(safe-area-inset-top));  
        }  
          
        /* ===== 契约登录层 ===== */
        #login-page { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); background: rgba(0,0,0,0.6); transition: opacity 0.8s ease, visibility 0.8s ease; pointer-events: auto; }
        #login-page.hidden-login { opacity: 0; visibility: hidden; pointer-events: none !important; display: none !important; }
        .login-card { background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 24px; padding: 40px 32px; width: 90%; max-width: 360px; text-align: center; }
        .login-card input { width: 100%; padding: 14px 20px; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; margin-bottom: 12px; transition: border-color 0.3s; font-family: var(--font-occult); }
        .login-card input:focus { border-color: var(--gold); }
        .login-card input::placeholder { color: var(--text); opacity: 0.3; }
        .login-error { color: #ff6b6b; font-size: 12px; margin-top: 8px; min-height: 18px; }
        #login-page .btn-oracle { width: 100%; padding: 14px 0; border-radius: 16px; font-size: 14px; cursor: pointer; margin-top: 4px; }
        .login-divider { display: flex; align-items: center; margin: 20px 0; gap: 12px; }
        .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
        .login-divider span { font-size: 11px; opacity: 0.4; letter-spacing: 0.2em; font-family: var(--font-occult); }
        /* 聊天气泡自适应 */  
        .chat-bubble-user {  
            background: var(--bubble-user-bg);  
            border: 1px solid var(--glass-border);  
            color: var(--gold);  
            border-radius: 18px 18px 4px 18px;  
            transition: background 0.4s ease, border-color 0.4s ease;  
        }  
        .chat-bubble-ai {  
            background: var(--bubble-ai-bg);  
            border: 1px solid var(--bubble-ai-border);  
            color: var(--text);  
            border-radius: 18px 18px 18px 4px;  
            transition: background 0.4s ease, border-color 0.4s ease;  
        }  
    /* ================= 64帧大颗粒像素高帧率核心适配 ================= */
/* web-pet 伴灵系统已替换原有精灵图 */
#page-2a .frosted {
    background: linear-gradient(180deg, rgba(30, 30, 38, 0.4) 0%, rgba(15, 15, 20, 0.7) 100%);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
}
.portal-active {
    animation: portalPulse 0.5s ease infinite alternate;
    border-color: var(--gold) !important;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
}
@keyframes portalPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

/* ===== 伴灵高级出入场：迷雾与粒子重组 ===== */
.mist-dissipate {
    animation: mistDissipateAnim 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    pointer-events: none;
}
@keyframes mistDissipateAnim {
    0% { transform: scale(1); filter: blur(0px); opacity: 1; }
    40% { transform: scale(1.1) translateY(-5px); filter: blur(4px); opacity: 0.6; }
    100% { transform: scale(1.5) translateY(-20px); filter: blur(16px); opacity: 0; }
}
.mist-reform {
    animation: mistReformAnim 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes mistReformAnim {
    0% { transform: scale(0.5) translateY(30px); filter: blur(16px); opacity: 0; }
    50% { transform: scale(1.1) translateY(-5px); filter: blur(2px); opacity: 0.9; }
    100% { transform: scale(1) translateY(0); filter: blur(0px); opacity: 1; }
}

    <script>
      function loadSupabase(){
        if(loadSupabase._p) return loadSupabase._p;
        loadSupabase._p = new Promise(function(resolve,reject){
          if(window.supabase){resolve(window.supabase);return;}
          var s=document.createElement('script');
          s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
          s.onload=function(){resolve(window.supabase);};
          s.onerror=function(){reject('Supabase SDK load failed');};
          document.head.appendChild(s);
        });
        return loadSupabase._p;
      }
    </script>

        async function fetchAIResponse(promptText) {  
            const loadingId = 'loading-' + Date.now();  
            dom.chatContainer.innerHTML += `<div id="${loadingId}" class="mist-reveal flex space-x-2 mt-4 ml-2"><span class="w-2 h-2 rounded-full bg-[var(--gold)] animate-bounce"></span><span class="w-2 h-2 rounded-full bg-[var(--gold)] animate-bounce" style="animation-delay: 0.1s"></span><span class="w-2 h-2 rounded-full bg-[var(--gold)] animate-bounce" style="animation-delay: 0.2s"></span></div>`;  
            setTimeout(() => { dom.aiScrollView.scrollTop = dom.aiScrollView.scrollHeight; }, 100);  
  
            try {  
                const response = await fetch(BACKEND_URL, {   
                    method: "POST",   
                    headers: { "Content-Type": "application/json" },   
                    body: JSON.stringify({ prompt: promptText, stream: true })   
                });  
                  
                document.getElementById(loadingId)?.remove();  
                if (!response.ok) throw new Error("API Connection Failed");  
  
                const aiBubble = document.createElement('div');  
                aiBubble.className = "mist-reveal mt-4 p-5 chat-bubble-ai text-[15px] leading-loose font-light whitespace-pre-wrap tracking-wide text-justify font-occult self-start w-full md:max-w-[90%]";  
                dom.chatContainer.appendChild(aiBubble);  
                  
                const reader = response.body.getReader();  
                const decoder = new TextDecoder("utf-8");  
                let fullText = "";  
  
                while (true) {  
                    const { done, value } = await reader.read();  
                    if (done) break;  
                      
                    const chunk = decoder.decode(value, { stream: true });  
                    const lines = chunk.split('\n');  
                      
                    for (const line of lines) {  
                        const trimmedLine = line.trim();  
                        if (!trimmedLine || trimmedLine === 'data: [DONE]') continue;  
                          
                        if (trimmedLine.startsWith('data: ')) {  
                            try {  
                                const data = JSON.parse(trimmedLine.slice(6));  
                                if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {  
                                    fullText += data.choices[0].delta.content;  
                                    aiBubble.innerText = fullText;  
                                    dom.aiScrollView.scrollTop = dom.aiScrollView.scrollHeight;  
                                }  
                            } catch (e) {}  
                        } else if (trimmedLine.startsWith('{')) { // 兼容非流式  
                            try {  
                                const data = JSON.parse(trimmedLine);  
                                if (data.choices && data.choices[0].message) {  
                                    fullText = data.choices[0].message.content;  
                                    aiBubble.innerText = fullText;  
                                    dom.aiScrollView.scrollTop = dom.aiScrollView.scrollHeight;  
                                }  
                            } catch (e) {}  
                        }  
                    }  
                }  
                currentAIContext = promptText + "\nAI回复：" + fullText + "\n";  
            } catch (error) {  
                document.getElementById(loadingId)?.remove();  
                dom.chatContainer.innerHTML += `<div class="mist-reveal mt-4 text-red-400 text-sm text-center">灵力中断：能量波长不匹配，或接口已进入睡眠状态。</div>`;  
                console.error(error);  
            }  
        }

                    if (appPhase === 'converging' && coreEnergy > 0) { let targetRadius = Math.min(80, Math.max(10, coreEnergy)); coreRadius += (targetRadius - coreRadius) * 0.1; if (coreRadius > 1) { let gradient = ctx.createRadialGradient(width/2, targetCoreY, 0, width/2, targetCoreY, coreRadius); gradient.addColorStop(0, document.body.classList.contains('light') ? 'rgba(184, 147, 36, 0.8)' : 'rgba(255, 255, 255, 0.8)'); gradient.addColorStop(0.3, document.body.classList.contains('light') ? 'rgba(184, 147, 36, 0.4)' : 'rgba(212, 175, 55, 0.6)'); gradient.addColorStop(1, 'rgba(212, 175, 55, 0)'); ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(width/2, targetCoreY, coreRadius, 0, Math.PI*2); ctx.fill(); } }  
                    particles.forEach((p, index) => { p.update(appPhase); p.draw(ctx); if (p.life <= 0 || p.absorbed) particles.splice(index, 1); }); ctx.restore();  
                }  
                  
                if (appPhase === 'drawing') getRenderedCarouselCards().forEach(c => drawGraphic(c.x, c.y, c.scale, false, 0));  
                for (let i = movingCards.length - 1; i >= 0; i--) { let mc = movingCards[i]; mc.progress += 0.04; let t = Math.min(mc.progress, 1); let easeT = 1 - Math.pow(1 - t, 3); drawGraphic(mc.startX + (mc.targetX - mc.startX) * easeT, mc.startY + (mc.targetY - mc.startY) * easeT, mc.startScale + (mc.targetScale - mc.startScale) * easeT, false, 0); if (t === 1) movingCards.splice(i, 1); }  
                let allFlipped = spreadCards.length > 0;  
                  
                spreadCards.forEach((sc, i) => {  
                    const coords = getSlotCoords(i, isExpanded); if (sc.isFlipping) { sc.flipProgress += 0.035; if(sc.flipProgress >= 1) sc.isFlipping = false; }  
                    if (sc.flipProgress >= 0.5) { sc.textProgress += 0.015; if (sc.textProgress > 1) sc.textProgress = 1; if (appPhase === 'interacting' && Math.random() > 0.05) for(let k=0; k<3; k++) particles.push(new LightParticle(coords.x, coords.y)); }  
                    if (sc.flipProgress < 1) allFlipped = false;  
                    if (!movingCards.some(mc => mc.id === sc.id)) drawGraphic(coords.x, coords.y, coords.scale, false, sc.flipProgress, sc.textProgress, sc.tarotData, sc.isReversed);  
                });  
                  
                if (appPhase === 'interacting' && allFlipped && !movingCards.length && !spreadCards.some(sc => sc.isFlipping)) {   
                    appPhase = 'converging'; convergeStartTime = Date.now();   
                    setTimeout(() => { 
                    appPhase = 'finished'; coreEnergy = 0; coreRadius = 0; particles = []; 
                    dom.decodeModule.classList.remove('btn-hidden'); dom.decodeModule.classList.add('btn-reveal'); 
                    
                    // 🌟 开牌结束，伴灵从虚空重组
                    const petEl = document.querySelector('.web-pet');
                    if (petEl) {
                        petEl.style.left = '50%'; petEl.style.top = '60%'; petEl.style.transform = 'translateX(-50%)';
                        petEl.classList.remove('mist-dissipate');
                        petEl.classList.add('mist-reform');
                        for(let i = 0; i < 20; i++) {
                            particles.push(new LightParticle(width/2, targetCoreY - 60));
                        }
                    }
                }, CONVERGE_DURATION);   
                }  
            }  
            requestAnimationFrame(render);  
        }  
        render();

                        tips.innerHTML = '🎉 成功重铸伴灵契约！<br><span class="italic opacity-60">"虚空波长已稳定接通。"</span>'; 
                    }, 1500); 
                };
            }
        };
        NexusController.init();
